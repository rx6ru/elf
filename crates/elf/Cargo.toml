[package]
name = "elf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Voice dictation daemon and CLI for Linux and Hyprland"
readme = "README.md"

[lib]
name = "elf"
path = "src/lib.rs"

[[bin]]
name = "elfd"
path = "src/bin/elfd.rs"

[[bin]]
name = "elf"
path = "src/bin/elf.rs"

[dependencies]
elf-hud = { path = "../elf-hud" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
webpki-roots = "1"
